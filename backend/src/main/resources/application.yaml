spring:
  application:
    name: viegym-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/viegym}
    username: ${DB_USER:viegym}
    password: ${DB_PASSWORD}
    hikari:
      # Database chết thì báo lỗi trong 5 giây, trước timeout 10 giây của app.
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  # BR-A07: email đặt lại mật khẩu qua SMTP. Mặc định là Mailpit local (infra/compose.yaml, giao diện
  # http://127.0.0.1:8025), không gửi ra ngoài. SMTP thật: đặt MAIL_HOST/PORT/USERNAME/PASSWORD qua biến môi trường.
  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jackson:
    deserialization:
      # Trường số nguyên (reps...) nhận 10.5 thì báo 400, không âm thầm cắt thành 10 (ngày 8).
      accept-float-as-int: false

server:
  port: 8080
  address: 127.0.0.1

viegym:
  auth:
    issuer: viegym-backend
    audience: viegym-mobile
    # BR-A03. Phiên có hạn tuyệt đối; refresh xoay vòng không kéo dài quá mốc này.
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    session-ttl: 30d
    # Khóa nằm ngoài Git (infra/secrets/, đã ignore). Tạo khóa: docs/09-auth-design.md §6.
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:file:../infra/secrets/jwt-private.pem}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:../infra/secrets/jwt-public.pem}
  ai:
    # Tắt AI Coach mà không cần sửa code: AI_ENABLED=false → 503 AI_DISABLED.
    enabled: ${AI_ENABLED:true}
    service-url: ${AI_SERVICE_URL:http://127.0.0.1:8000}
    # Khóa nội bộ backend ↔ ai-service, khác khóa JWT; chỉ đặt qua biến môi trường.
    internal-key: ${AI_INTERNAL_KEY:}
    connect-timeout: 3s
    # BR-AI04: chờ AI tối đa 30 giây (ai-service tự cắt ở 25 giây).
    timeout: 30s
    per-minute: 5
    per-day: 50
    history-size: 10
  login-limit:
    # BR-A09 (ngày 17): đăng nhập sai quá 5 lần/email hoặc 20 lần/IP trong 15 phút → 429, chờ rồi thử lại.
    max-failures-per-email: 5
    max-failures-per-ip: 20
    window: 15m
  password-reset:
    # BR-A06 / docs/05 §2.
    code-ttl: 15m
    max-attempts: 5
    per-email-per-hour: 3
    reset-per-ip: 10
    reset-ip-window: 15m
    # Người gửi hiển thị trong email; SMTP thật thường yêu cầu trùng tài khoản đăng nhập.
    mail-from: ${MAIL_FROM:VieGym <no-reply@viegym.local>}
  admin:
    # docs/31 §2: tạo ADMIN lúc khởi động nếu email chưa tồn tại. Chỉ đặt qua biến môi trường
    # (không commit mật khẩu); để trống thì không làm gì.
    bootstrap-email: ${ADMIN_EMAIL:}
    bootstrap-password: ${ADMIN_PASSWORD:}
    bootstrap-full-name: ${ADMIN_FULL_NAME:Quản trị viên}
