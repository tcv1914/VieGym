# Admin staging: phục vụ admin/dist và chuyển /api, /media sang backend (cùng origin, không cần CORS),
# giống proxy của Vite ở DEV.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /media/ {
        proxy_pass http://backend:8080;
    }
    location / {
        try_files $uri /index.html;
    }
}
